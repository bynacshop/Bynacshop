<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BYNAC | Beyond Norms and Conformity</title>
    <link rel="icon" type="image/jpeg" href="Logo.jpg">
    <link rel="apple-touch-icon" href="Logo.jpg">

    <style>
        html { scroll-behavior: smooth; }
        body {
            margin: 0; padding: 0;
            background-color: #050505;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            overflow-x: hidden;
        }

        /* --- ANIMACIONES --- */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes expand { from { width: 0; } to { width: 60px; } }

        /* MÚSICA */
        .header-controls { position: fixed; top: 20px; right: 20px; z-index: 1000; }
        .music-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); color: #fff;
            padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 0.6rem;
            text-transform: uppercase; letter-spacing: 2px;
        }

        /* --- PORTADA REFINADA --- */
        .hero { 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
        }
        
        /* El Logo como detalle superior */
        .logo-top {
            width: 65px; /* Tamaño pequeño y elegante */
            height: auto;
            margin-bottom: 15px;
            opacity: 0;
            animation: fadeIn 1s ease-out forwards;
        }

        h1 { 
            font-size: 4rem; 
            letter-spacing: 15px; 
            text-transform: uppercase; 
            margin: 0;
            opacity: 0;
            animation: fadeIn 1s ease-out forwards;
            animation-delay: 0.4s;
        }
        
        .line { 
            height: 2px; 
            background-color: #fff; 
            margin: 20px auto; 
            animation: expand 1s ease-in-out forwards; 
            animation-delay: 0.8s; 
        }
        
        .tagline { 
            font-size: 1rem; 
            letter-spacing: 5px; 
            color: #666; 
            text-transform: uppercase; 
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeIn 1s ease-out forwards;
            animation-delay: 1.2s;
        }
        
        .btn-tienda {
            display: inline-block; 
            padding: 18px 50px; 
            border: 1.5px solid #ffffff; 
            color: #ffffff;
            text-decoration: none; 
            font-size: 0.8rem; 
            border-radius: 40px; 
            text-transform: uppercase;
            letter-spacing: 3px; 
            opacity: 0;
            animation: fadeIn 1s ease-out forwards;
            animation-delay: 1.6s;
            transition: 0.3s;
        }
        .btn-tienda:hover { background: #fff; color: #000; }

        /* SECCIÓN SELECCIÓN */
        #menu-coleccion {
            min-height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background-color: #080808; border-top: 1px solid #1a1a1a;
            padding: 40px 0;
        }
        .grid-seleccion { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 90%; max-width: 800px; }
        .opcion-card { height: 250px; background: #111; border: 1px solid #222; display: flex; justify-content: center; align-items: center; text-decoration: none; color: #fff; border-radius: 8px; }

        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; letter-spacing: 8px; }
            .logo-top { width: 55px; }
            .grid-seleccion { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="header-controls">
        <button class="music-btn" onclick="toggleMusic()">TECHNO: ON/OFF</button>
    </div>

    <audio id="bgMusic" loop><source src="musica.mp3" type="audio/mpeg"></audio>

    <section class="hero">
        <img src="Logo.jpg" alt="Logo" class="logo-top">
        
        <h1>BYNAC</h1>
        <div class="line"></div>
        <p class="tagline">Beyond Norms and Conformity</p>
        <a href="#menu-coleccion" class="btn-tienda">Ver Colección</a>
    </section>

    <section id="menu-coleccion">
        <h2 style="letter-spacing: 5px; margin-bottom: 30px;">CATEGORÍAS</h2>
        <div class="grid-seleccion">
            <a href="#cat-camisetas" class="opcion-card"><h2>CAMISETAS</h2></a>
            <a href="#cat-sudaderas" class="opcion-card"><h2>SUDADERAS</h2></a>
        </div>
    </section>

    <script>
        function toggleMusic() {
            var audio = document.getElementById('bgMusic');
            if (audio.paused) { audio.play(); } else { audio.pause(); }
        }
    </script>
</body>
</html>
