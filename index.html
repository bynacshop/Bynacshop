<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BYNAC | Beyond Norms and Conformity</title>

    <style>
        html { scroll-behavior: smooth; }
        body {
            margin: 0; padding: 0;
            background-color: #050505;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            overflow-x: hidden;
        }

        /* --- LOGO FIJO SIN INTERFERENCIAS --- */
        .brand-corner {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 9999; 
            pointer-events: none; /* Los clics pasan a través si algo queda debajo */
        }
        
        .brand-corner img {
            width: 50px; /* Tamaño optimizado para móvil */
            height: auto;
            display: block;
            filter: brightness(1);
            animation: fadeIn 1.2s ease-out forwards, darkGlitch 7s infinite;
            animation-delay: 0.5s, 3s; 
        }

        /* GLITCH NEGRO SUTIL (Cada 7 seg) */
        @keyframes darkGlitch {
            0%, 90%, 94%, 98%, 100% { transform: translate(0); filter: brightness(1); clip-path: inset(0 0 0 0); }
            91% { transform: translate(-3px, 1px); filter: brightness(0); clip-path: inset(20% 0 50% 0); }
            93% { transform: translate(3px, -1px); filter: brightness(0.2); }
            95% { filter: brightness(0); transform: scaleY(1.1); }
            97% { transform: translate(-2px, 0); clip-path: inset(70% 0 10% 0); }
        }

        /* CONTROLES MÚSICA */
        .header-controls { position: fixed; top: 20px; right: 20px; z-index: 10000; }
        .music-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); color: #fff;
            padding: 8px 12px; border-radius: 20px; cursor: pointer; font-size: 0.55rem;
            text-transform: uppercase; letter-spacing: 2px;
        }

        /* PORTADA (HERO) */
        .hero { 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
        }
        h1 { font-size: 3.5rem; letter-spacing: 12px; text-transform: uppercase; margin: 0; }
        .tagline { font-size: 0.9rem; letter-spacing: 4px; color: #666; margin-top: 15px; }

        .btn-tienda { 
            display: inline-block; 
            padding: 15px 40px; 
            border: 1.5px solid #ffffff; 
            color: #ffffff; 
            text-decoration: none; 
            font-size: 0.8rem; 
            border-radius: 40px; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            margin-top: 40px; 
            transition: 0.3s;
            background: #050505; /* Fondo sólido para que no se transparente el logo debajo */
        }
        .btn-tienda:hover { background: #fff; color: #000; }

        /* CATEGORÍAS */
        #menu-coleccion {
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            background-color: #080808; 
            border-top: 1px solid #1a1a1a; 
            padding: 80px 0;
        }
        .titulo-seccion { letter-spacing: 8px; margin-bottom: 40px; text-transform: uppercase; font-size: 1.5rem; }
        .grid-seleccion { display: flex; flex-direction: column; gap: 20px; width: 90%; max-width: 400px; }
        .opcion-card { 
            height: 200px; 
            background: #111; 
            border: 1px solid #222; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            text-decoration: none; 
            color: #fff; 
            border-radius: 10px;
            transition: 0.3s;
        }
        .opcion-card:hover { border-color: #fff; }

        /* SECCIÓN PRODUCTOS */
        .seccion-productos { padding: 60px 20px; }
        .producto-card { max-width: 600px; margin: 0 auto 80px auto; background: #0a0a0a; padding: 15px; border: 1px solid #1a1a1a; }
        .fotos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .img-container { width: 100%; height: 350px; background: #151515; overflow: hidden; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }

        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; letter-spacing: 6px; }
            .brand-corner img { width: 42px; }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="brand-corner">
        <img src="Logo.jpg" alt="Logo BYNAC">
    </div>

    <div class="header-controls">
        <button class="music-btn" onclick="toggleMusic()">TECHNO: ON/OFF</button>
    </div>

    <audio id="bgMusic" loop><source src="musica.mp3" type="audio/mpeg"></audio>

    <section class="hero">
        <h1>BYNAC</h1>
        <p class="tagline">BEYOND NORMS AND CONFORMITY</p>
        <a href="#menu-coleccion" class="btn-tienda">VER COLECCIÓN</a>
    </section>

    <section id="menu-coleccion">
        <h2 class="titulo-seccion">CATEGORÍAS</h2>
        <div class="grid-seleccion">
            <a href="#cat-camisetas" class="opcion-card"><h2>CAMISETAS</h2></a>
            <a href="#cat-sudaderas" class="opcion-card"><h2>SUDADERAS</h2></a>
        </div>
    </section>

    <div class="seccion-productos">
        <div id="cat-camisetas">
            <div class="producto-card">
                <div class="fotos-grid">
                    <div class="img-container"><img src="camiseta_gris_delante.jpg"></div>
                    <div class="img-container"><img src="camiseta_gris_detras.jpg"></div>
                </div>
                <p style="letter-spacing: 2px; text-transform: uppercase; margin-top: 15px;">Camiseta Gris Street</p>
            </div>
        </div>
    </div>

    <script>
        function toggleMusic() {
            var audio = document.getElementById('bgMusic');
            if (audio.paused) { audio.play(); } else { audio.pause(); }
        }
    </script>
</body>
</html>
