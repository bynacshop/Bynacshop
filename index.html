<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BYNAC | Beyond Norms and Conformity</title>

    <link rel="icon" type="image/jpeg" href="Logo.jpg">
    <link rel="apple-touch-icon" href="Logo.jpg">

    <style>
        html { scroll-behavior: smooth; }
        body {
            margin: 0; padding: 0;
            background-color: #050505;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            overflow-x: hidden;
        }

        /* --- LOGO CON DISTORSIÓN EN NEGRO (VOID GLITCH) --- */
        .brand-corner {
            position: fixed;
            top: 25px;
            left: 25px;
            z-index: 1100;
        }
        
        .brand-corner img {
            width: 55px;
            height: auto;
            opacity: 0;
            display: block;
            /* Animación de entrada y glitch de sombras negras */
            animation: fadeIn 1.2s ease-out forwards, darkGlitch 0.8s infinite;
            animation-delay: 0.5s, 2s; 
        }

        /* ANIMACIÓN GLITCH NEGRO / SOMBRAS */
        @keyframes darkGlitch {
            0% { transform: translate(0); filter: brightness(1); }
            10% { transform: translate(-2px, -1px); clip-path: inset(10% 0 30% 0); filter: brightness(0); }
            20% { transform: translate(2px, 1px); clip-path: inset(40% 0 10% 0); filter: brightness(1); }
            30% { transform: translate(-1px, 2px); filter: contrast(2) brightness(0.5); }
            40% { transform: translate(0); clip-path: inset(0 0 0 0); filter: brightness(1); }
            50% { transform: translate(1px, -2px); filter: brightness(0); }
            52% { filter: brightness(1); }
            100% { transform: translate(0); }
        }

        /* MÚSICA */
        .header-controls { position: fixed; top: 25px; right: 25px; z-index: 1100; }
        .music-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); color: #fff;
            padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 0.6rem;
            text-transform: uppercase; letter-spacing: 2px; transition: 0.3s;
        }

        /* PORTADA */
        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        h1 { font-size: 4rem; letter-spacing: 15px; text-transform: uppercase; margin: 0; animation: fadeInDown 1.2s ease-out forwards; }
        .tagline { font-size: 1rem; letter-spacing: 5px; color: #444; margin-top: 10px; text-transform: uppercase; }

        .btn-tienda { 
            display: inline-block; padding: 18px 50px; border: 1.5px solid #ffffff; color: #ffffff; 
            text-decoration: none; font-size: 0.9rem; border-radius: 40px; text-transform: uppercase; 
            letter-spacing: 3px; margin-top: 50px; transition: 0.3s;
            opacity: 0; animation: fadeIn 1s forwards; animation-delay: 2.2s;
        }
        .btn-tienda:hover { background: #fff; color: #000; }

        /* SECCIONES */
        #menu-coleccion {
            min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background-color: #080808; border-top: 1px solid #1a1a1a; padding: 60px 0;
        }
        .grid-seleccion { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; width: 90%; max-width: 900px; }
        .opcion-card { height: 280px; background: #111; border: 1px solid #222; display: flex; justify-content: center; align-items: center; text-decoration: none; color: #fff; border-radius: 10px; transition: 0.4s; }
        .opcion-card h2 { font-size: 1.3rem; letter-spacing: 5px; }
        .opcion-card:hover { border-color: #fff; }

        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; letter-spacing: 8px; }
            .grid-seleccion { grid-template-columns: 1fr; }
            .brand-corner img { width: 45px; }
        }
    </style>
</head>
<body>

    <div class="brand-corner">
        <img src="Logo.jpg" alt="Logo BYNAC">
    </div>

    <div class="header-controls">
        <button class="music-btn" onclick="toggleMusic()">TECHNO: ON/OFF</button>
    </div>

    <audio id="bgMusic" loop><source src="musica.mp3" type="audio/mpeg"></audio>

    <section class="hero">
        <h1>BYNAC</h1>
        <p class="tagline">Beyond Norms and Conformity</p>
        <a href="#menu-coleccion" class="btn-tienda">Ver Colección</a>
    </section>

    <section id="menu-coleccion">
        <h2 style="letter-spacing: 8px; margin-bottom: 40px;">CATEGORÍAS</h2>
        <div class="grid-seleccion">
            <a href="#" class="opcion-card"><h2>Camisetas</h2></a>
            <a href="#" class="opcion-card"><h2>Sudaderas</h2></a>
        </div>
    </section>

    <script>
        function toggleMusic() {
            var audio = document.getElementById('bgMusic');
            if (audio.paused) { audio.play().catch(e => console.log("User interaction required")); } 
            else { audio.pause(); }
        }
    </script>
</body>
</html>
